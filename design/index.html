<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otaku Track — Design System & UI/UX per Halaman</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ SHOWCASE SHELL (bukan bagian dari desain aplikasi) ============ */
*{box-sizing:border-box}
body{margin:0;background:#04080f;color:#e8edf5;font-family:Inter,system-ui,sans-serif}
.showcase{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
.show-head{text-align:center;margin:18px 0 26px}
.show-head h1{font-family:'Space Grotesk';font-size:28px;margin:0 0 6px}
.show-head p{color:#7e8ca2;font-size:13px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:sticky;top:0;background:rgba(4,8,15,.95);backdrop-filter:blur(10px);padding:14px 0;z-index:50;border-bottom:1px solid #17233615}
.tab{border:1px solid #223048;background:#0b1421;color:#aeb9cb;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.tab:hover{border-color:#3f83f8;color:#fff}
.tab.on{background:#3f83f8;border-color:#3f83f8;color:#fff}
.page{display:none}
.page.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.frame{border:1px solid #1e2c42;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#070e1a}
.frame-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0a1120;border-bottom:1px solid #1a2840}
.dot{width:10px;height:10px;border-radius:50%}
.frame-url{flex:1;background:#0e1728;border:1px solid #1c2a41;border-radius:8px;padding:5px 12px;font-size:11px;color:#66788f;font-family:monospace}
.notes{background:#0b1421;border:1px solid #1d2b42;border-left:3px solid #3f83f8;border-radius:10px;padding:16px 18px;margin:16px 0 28px;font-size:12.5px;color:#aab6c8;line-height:1.7}
.notes b{color:#dce6f5}
.notes ul{margin:6px 0 0;padding-left:18px}
.page-label{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.page-label span{font-size:11px;font-weight:800;letter-spacing:.15em;color:#5f9bf5;text-transform:uppercase}
.page-label hr{flex:1;border:0;border-top:1px solid #1c2a41;margin:0}
</style>
</head>
<body>
<div class="showcase">
  <div class="show-head">
    <h1>Otaku Track — UI/UX Redesign</h1>
    <p>10 halaman · dark theme "Midnight Navy" · klik tab untuk pindah halaman</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="pages"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const PAGES=[
["home","01 · Home"],["explore","02 · Explore"],["detail","03 · Detail"],["login","04 · Auth"],
["forum","05 · Forum"],["thread","06 · Thread"],["profile","07 · Profile"],["admin","08 · Admin"],["sys","09 · Design System"]
];
const tabs=document.getElementById('tabs'),pages=document.getElementById('pages');
PAGES.forEach(([id,label],i)=>{
  const t=document.createElement('button');t.className='tab'+(i===0?' on':'');t.textContent=label;t.dataset.for=id;
  t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='pg-'+id));window.scrollTo({top:0,behavior:'smooth'});};
  tabs.appendChild(t);
  const d=document.createElement('div');d.className='page'+(i===0?' on':'');d.id='pg-'+id;
  d.innerHTML='<div class="page-label"><span>'+label+'</span><hr></div><div class="frame"><div class="frame-bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><div class="frame-url" id="url-'+id+'">otaku-track.test/</div></div><div id="in-'+id+'"></div></div><div class="notes" id="nt-'+id+'"></div>';
  pages.appendChild(d);
});
</script>
<style>
/* ============ MOCKUP APP STYLES (design hasil rapian) ============ */
#pages .app{background:linear-gradient(180deg,#07101c,#0b1220 40%,#080f1b);color:#f5f7fb;font-family:Inter,sans-serif;min-height:520px}
#pages .app .wrap{max-width:1100px;margin:0 auto;padding:0 24px}
/* NAV */
.app .nav{position:relative;z-index:5;display:flex;align-items:center;gap:20px;padding:14px 24px;background:rgba(7,14,26,.85);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:15px}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3f83f8,#7c5cff);display:grid;place-items:center;font-size:12px;box-shadow:0 6px 18px rgba(63,131,248,.45)}
.nlinks{display:flex;gap:20px}
.nlinks a{color:#8fa0b8;font-size:12.5px;font-weight:500;text-decoration:none}
.nlinks a.on,#pages .nlinks a:hover{color:#fff}
.nsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:#0e1728;border:1px solid #24334d;border-radius:10px;padding:7px 12px;width:230px}
.nsearch i{color:#5c6f8c;font-size:11px}
.nsearch span{color:#66788f;font-size:11.5px}
.nbtns{display:flex;gap:10px;align-items:center}
.ghost{border:1px solid #2a3b58;background:transparent;color:#c3cfe0;border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:600;cursor:pointer}
.pri{background:linear-gradient(135deg,#3f83f8,#2f6de0);border:none;color:#fff;border-radius:8px;padding:8px 16px;font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(63,131,248,.35)}
.avatarpill{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#20365f,#2f6de0);display:grid;place-items:center;font-size:11px;font-weight:800;color:#bcd6ff}
/* HERO */
.hero{position:relative;height:340px;background:linear-gradient(115deg,#12213e 0%,#1c2f52 45%,#3b2a63 100%);display:flex;align-items:center;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,13,25,.95) 15%,rgba(6,13,25,.4) 55%,transparent)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 80% 20%,rgba(124,92,255,.25),transparent)}
.hin{position:relative;z-index:2;padding:0 48px;max-width:560px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(63,131,248,.15);color:#8fbcff;border:1px solid rgba(63,131,248,.35);border-radius:999px;padding:4px 11px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero h2{font-family:'Space Grotesk';font-size:38px;font-weight:700;margin:14px 0 10px;line-height:1.1}
.hero p{color:#a9b7cc;font-size:13px;line-height:1.7;max-width:440px;margin:0 0 20px}
.meta{display:flex;gap:14px;color:#8fa0b8;font-size:11px;margin-bottom:20px}
.meta b{color:#ffc94f}
.dots{position:absolute;right:36px;bottom:24px;z-index:3;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#2e405f}
.dots i.on{background:#3f83f8;width:20px;border-radius:4px}
/* ROWS */
.row-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}
.row-head h4{margin:0;font-family:'Space Grotesk';font-size:16px;display:flex;align-items:center;gap:10px}
.row-head h4:before{content:"";width:4px;height:18px;border-radius:3px;background:linear-gradient(#3f83f8,#7c5cff)}
.row-head a{color:#6ea4ff;font-size:11.5px;text-decoration:none;font-weight:600}
.cards{display:flex;gap:16px;overflow:hidden}
.card{flex:0 0 150px}
.poster{position:relative;width:150px;height:215px;border-radius:10px;background:linear-gradient(160deg,#1b2a48,#0e1728);border:1px solid #25334a;overflow:hidden}
.poster.v2{background:linear-gradient(160deg,#2a1f45,#141026)}
.poster.v3{background:linear-gradient(160deg,#12332e,#0c1a1a)}
.poster .pin{position:absolute;top:8px;right:8px;background:rgba(6,11,20,.85);backdrop-filter:blur(4px);color:#ffc94f;font-size:9.5px;font-weight:700;border-radius:5px;padding:3px 7px}
.poster .type{position:absolute;top:8px;left:8px;background:rgba(63,131,248,.9);color:#fff;font-size:8.5px;font-weight:800;border-radius:4px;padding:2px 6px;letter-spacing:.05em}
.ct{font-size:11.5px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:10px;color:#7e8ca2;margin-top:2px}
</style>

document.getElementById('nt-home').innerHTML=`<b>Perbaikan UI/UX:</b><ul>
